<div class="product-body"><span class="category">Hogar</span><h3>Adorno personalizado</h3><p>Una idea para cumpleaños, celebraciones y rincones especiales.</p>
<div class="product-foot"><span class="price">$3.990</span><div class="product-actions">
<div class="qty-picker"><button type="button" onclick="cantidadProducto(this,-1)">−</button><output>1</output><button type="button" onclick="<script>
const NUMERO_WHATSAPP = "56977286221";
const LIMITE_POR_MODELO = 100;

function abrirWhatsApp(mensaje) {
  const url = "https://wa.me/" + NUMERO_WHATSAPP +
    "?text=" + encodeURIComponent(mensaje);
  window.open(url, "_blank");
}

const carrito = [];

const clp = n => new Intl.NumberFormat("es-CL", {
  style: "currency",
  currency: "CLP",
  maximumFractionDigits: 0
}).format(n);

/* Selector de cantidad de cada producto */
function cantidadProducto(boton, cambio) {
  const salida = boton.parentElement.querySelector("output");
  const actual = Number(salida.textContent) || 1;
  salida.textContent = Math.max(
    1,
    Math.min(LIMITE_POR_MODELO, actual + cambio)
  );
}

/* Agregar productos al carrito */
function agregar(id, nombre, precio, cantidad = 1) {
  const unidades = Number(cantidad);
  const existente = carrito.find(p => p.id === id);
  const cantidadActual = existente ? existente.cantidad : 0;

  if (!Number.isInteger(unidades) || unidades < 1 ||
      cantidadActual + unidades > LIMITE_POR_MODELO) {
    document.getElementById("estado-carrito").textContent =
      "El máximo es de 100 unidades por modelo.";
    return false;
  }

  if (existente) {
    existente.cantidad += unidades;
  } else {
    carrito.push({ id, nombre, precio, cantidad: unidades });
  }

  renderCarrito();
  document.getElementById("estado-carrito").textContent =
    nombre + " agregado al carrito.";
  return true;
}

function agregarSeleccionado(boton, id, nombre, precio) {
  const salida = boton.parentElement.querySelector(".qty-picker output");
  const cantidad = Number(salida.textContent) || 1;

  if (agregar(id, nombre, precio, cantidad)) {
    salida.textContent = "1";
  }
}

/* Cambiar las cantidades dentro del carrito */
function cambiar(id, cambio) {
  const producto = carrito.find(p => p.id === id);
  if (!producto) return;

  if (cambio > 0 && producto.cantidad >= LIMITE_POR_MODELO) {
    document.getElementById("estado-carrito").textContent =
      "Has alcanzado el límite de 100 unidades para este modelo.";
    return;
  }

  producto.cantidad += cambio;

  if (producto.cantidad <= 0) {
    carrito.splice(carrito.findIndex(p => p.id === id), 1);
  }

  renderCarrito();
}

function vaciar() {
  carrito.length = 0;
  renderCarrito();
  document.getElementById("estado-carrito").textContent =
    "Carrito vacío.";
}

/* Dibujar el contenido del carrito */
function renderCarrito() {
  const lista = document.getElementById("lista-carrito");
  lista.replaceChildren();

  const cantidadTotal = carrito.reduce((suma, p) => suma + p.cantidad, 0);
  document.getElementById("contador").textContent = cantidadTotal;

  let total = 0;

  if (!carrito.length) {
    const mensaje = document.createElement("div");
    mensaje.className = "empty";
    mensaje.textContent = "Todavía no agregas productos.";
    lista.appendChild(mensaje);
  }

  carrito.forEach(p => {
    total += p.precio * p.cantidad;

    const fila = document.createElement("div");
    fila.className = "cart-item";

    const info = document.createElement("div");
    const nombre = document.createElement("div");
    nombre.className = "item-name";
    nombre.textContent = p.nombre;

    const detalle = document.createElement("div");
    detalle.className = "item-detail";
    detalle.textContent = clp(p.precio) + " por unidad";

    info.append(nombre, detalle);

    const controles = document.createElement("div");
    controles.className = "item-controls";

    const menos = document.createElement("button");
    menos.className = "qty-btn";
    menos.textContent = "−";
    menos.type = "button";
    menos.setAttribute("aria-label", "Quitar una unidad de " + p.nombre);
    menos.onclick = () => cambiar(p.id, -1);

    const cantidad = document.createElement("span");
    cantidad.textContent = p.cantidad;

    const mas = document.createElement("button");
    mas.className = "qty-btn";
    mas.textContent = "+";
    mas.type = "button";
    mas.setAttribute("aria-label", "Agregar una unidad de " + p.nombre);
    mas.onclick = () => cambiar(p.id, 1);

    const subtotal = document.createElement("strong");
    subtotal.textContent = clp(p.precio * p.cantidad);

    controles.append(menos, cantidad, mas, subtotal);
    fila.append(info, controles);
    lista.appendChild(fila);
  });

  document.getElementById("total").textContent = clp(total);
}

/* Preparar el pedido y abrir WhatsApp */
function pedido() {
  const estado = document.getElementById("estado-carrito");

  if (!carrito.length) {
    estado.textContent =
      "Agrega al menos un producto antes de preparar tu pedido.";
    return;
  }

  const lineas = carrito.map(p =>
    `${p.nombre} x ${p.cantidad}: ${clp(p.precio * p.cantidad)}`
  );

  const total = carrito.reduce(
    (suma, p) => suma + p.precio * p.cantidad, 0
  );

  const cuerpo = [
    "¡Hola, AD NovaTech 3D Studio! ✨",
    "",
    "Quiero consultar por este pedido:",
    "",
    ...lineas,
    "",
    "Subtotal estimado: " + clp(total),
    "",
    "Quisiera confirmar disponibilidad, personalización, despacho y pago."
  ].join("\n");

  estado.textContent =
    "Se abrirá WhatsApp. Revisa el pedido y pulsa Enviar para mandarlo.";
  abrirWhatsApp(cuerpo);
}

/* Cotización personalizada por WhatsApp */
document.getElementById("form-cotizacion").addEventListener("submit", function(e) {
  e.preventDefault();

  const nombre = document.getElementById("cliente").value.trim();
  const tipo = document.getElementById("tipo").value;
  const detalles = document.getElementById("detalles").value.trim();

  const mensaje = [

    "",
    "Mi nombre es: " + nombre,
    "Quiero consultar por: " + tipo,
    "",
    "Detalles de mi idea:",
    detalles,
    "",
    "Quedo pendiente de la cotización. ¡Muchas gracias!"
  ].join("\n");

  document.getElementById("estado-form").textContent =
    "Abriendo WhatsApp para que revises y envíes tu consulta.";

  abrirWhatsApp(mensaje);
});

(function() {
  const secciones = Array.from(
    document.querySelectorAll("main > section")
  );

  function mostrarSeccion(id, actualizarHash = true) {

  }

  document.addEventListener("click", function(e) {
    const enlace = e.target.closest('a[href^="#"]');
    if (!enlace) return;

    const id = enlace
